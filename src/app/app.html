<div class="app-shell">
  <mat-toolbar class="app-toolbar">
    <a class="brand" routerLink="/budgets" aria-label="Drug Money home">
      <span class="brand-mark"><mat-icon aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Zm2.5-.5a.5.5 0 0 0-.5.5v1h13V6.5a.5.5 0 0 0-.5-.5h-12Zm12.5 5h-3a2 2 0 0 0 0 4h3v-4Zm-3 1.25a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5Z" /></svg></mat-icon></span>
      <span class="brand-name">Drug Money</span>
    </a>
    <span class="toolbar-spacer"></span>
    <span class="offline-status"><span class="status-dot"></span> Saved locally</span>
    @if (!showInstallPage() && !installLink.isActive && !install.isIos) {
      @switch (pwaUpdate.state()) {
        @case ('available') {
          <button mat-flat-button color="primary" type="button" (click)="pwaUpdate.update()">New Version Available</button>
        }
        @case ('checking') {
          <button mat-stroked-button type="button" disabled>Checking for updates...</button>
        }
        @case ('updating') {
          <button mat-stroked-button type="button" disabled>Updating Drug Money...</button>
        }
        @default {
          <button mat-stroked-button type="button" (click)="pwaUpdate.checkForUpdates()">Check for updates</button>
        }
      }
    }
    <a
      mat-button
      routerLink="/install"
      routerLinkActive
      #installLink="routerLinkActive"
      [hidden]="showInstallPage() || installLink.isActive || !install.showInstallAction()"
    >Install</a>
  </mat-toolbar>
  <main class="app-main">
    @if (showInstallPage()) {
      <app-installation-page (completed)="continueToApp()" />
    } @else {
      <router-outlet />
    }
  </main>
</div>
